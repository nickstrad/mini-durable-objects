openapi: 3.0.3
info:
  title: Mini Durable Objects API
  version: 0.2.0
  description: Create objects, then run SQL against them. Each object has its own SQLite database.
servers:
  - url: http://127.0.0.1:8787
paths:
  /objects/{id}:
    parameters:
      - $ref: '#/components/parameters/ObjectID'
    post:
      operationId: createObject
      summary: Create an object with an empty database
      description: Creates the object's database if needed. An existing object keeps its data.
      responses:
        '200':
          description: The object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Object'
        '400':
          $ref: '#/components/responses/InvalidID'
        '500':
          $ref: '#/components/responses/InternalError'
  /objects/{id}/sql:
    parameters:
      - $ref: '#/components/parameters/ObjectID'
    post:
      operationId: runSQL
      summary: Run SQL against the object's database
      description: >-
        Runs in its own transaction. SQLite's authorizer allows reads, row writes,
        and creating, altering, or dropping tables and indexes; PRAGMA, ATTACH,
        transactions, triggers, views, and temp objects are rejected.
        Returns at most 100 rows.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SQLRequest'
      responses:
        '200':
          description: Result columns and rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SQLResult'
        '400':
          description: Invalid object ID, invalid JSON, or bad query
          content:
            text/plain:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    ObjectID:
      name: id
      in: path
      required: true
      description: Object's filesystem identity
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{0,39}$'
        minLength: 1
        maxLength: 40
  schemas:
    Object:
      type: object
      required: [id]
      properties:
        id:
          type: string
    SQLRequest:
      type: object
      required: [sql]
      properties:
        sql:
          type: string
          description: Use ? placeholders for values.
        params:
          type: array
          description: Values for the ? placeholders. Numbers must be 64-bit integers.
          items: {}
    SQLResult:
      type: object
      required: [columns, rows]
      properties:
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            items: {}
  responses:
    InvalidID:
      description: Invalid object ID
      content:
        text/plain:
          schema:
            type: string
    NotFound:
      description: Object database does not exist
      content:
        text/plain:
          schema:
            type: string
    InternalError:
      description: Storage or database failure
      content:
        text/plain:
          schema:
            type: string
